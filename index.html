function onWin() {
    previousBest = save.bests[stage.id];
    recordWin(save, stage.id, state.time);
    persist();
    audio.effect("win", save.settings.sfx);
    clearInput();
    celebration = 0;
    setTimeout(()=>{
        if (page === "play" && state.status === "won" && !modal.open) result();
    }, save.settings.reducedMotion ? 50 : 650);
}
function result() {
    const final = stage.id === 15, isRecord = previousBest === undefined || state.time < previousBest;
    showModal(`<div class="result-orbit">✧</div><div class="eyebrow">${final ? "ALL GARDENS COMPLETE" : "SHADOW DELIVERED"}</div><h2 id="modal-title">${final ? "最後の影が、届いた。" : "影が、ひと足先に。"}</h2><p class="muted">${stage.id === 1 ? "ゴールするのは、あなたじゃない。" : final ? "15の庭を歩いたきみへ。光は、いつもそこに。" : `STAGE ${String(stage.id).padStart(2, "0")} · ${stage.title}`}</p><div class="result-time">${format(state.time)}<span class="record-badge">${isRecord ? "NEW BEST" : "CLEAR TIME"}</span></div><div class="best-time">自己ベスト <strong>${format(save.bests[stage.id])}</strong></div><div class="modal-actions">${button(final ? "stages" : "next", final ? "15の庭を振り返る" : "次のステージへ", "arrow", "primary")}${button("retry", "もう一度", "retry", "secondary")}${button("share", "結果をシェア", "share", "quiet")}</div>${final ? '<p class="fine">また違う道を探しに、いつでも。</p>' : ""}`);
}
function fail() {
    audio.effect("fail", save.settings.sfx);
    showModal(`<div class="failure-symbol">×</div><div class="eyebrow">ONE MORE TRY</div><h2 id="modal-title">影が当たった！</h2><p class="muted">赤く光ったとげに、影が触れたよ。<br>光に近づくと、影は短くなる。</p><div class="modal-actions">${button("retry", "もう一度ためす", "retry", "primary")}${button("stages", "ステージを選ぶ", "grid", "quiet")}</div>`);
}
function pause() {
    if (page !== "play" || state.status !== "playing") return;
    showModal(`<div class="eyebrow">TAKE A LITTLE BREATH</div><h2 id="modal-title">ひと休み。</h2><p class="muted">光も影も、待っているよ。</p><div class="modal-actions">${button("resume", "つづける", "arrow", "primary")}${button("retry", "はじめから", "retry", "secondary")}${button("stages", "ステージを選ぶ", "grid", "quiet")}${button("settings", "設定", "settings", "quiet")}</div>`);
}
function settings() {
    showModal(`<div class="eyebrow">MAKE YOURSELF COMFORTABLE</div><h2 id="modal-title">設定</h2><div class="settings-list">${[
        [
            "bgm",
            "音楽",
            "小さな光をイメージした、自作の環境音"
        ],
        [
            "sfx",
            "効果音",
            "成功と失敗を、音でもお知らせ"
        ],
        [
            "precision",
            "ゆっくり移動",
            "移動速度を45%に。細かく動かしたいときに"
        ],
        [
            "reducedMotion",
            "演出を控えめに",
            "光の揺らぎや背景の動きを抑えます"
        ]
    ].map(([k, label, desc])=>`<label class="setting-row"><span>${label}<small>${desc}</small></span><input type="checkbox" data-setting="${k}" ${save.settings[k] ? "checked" : ""}><span class="toggle" aria-hidden="true"></span></label>`).join("")}</div><label class="url-setting">共有用の公開URL（任意）<input id="share-url" type="url" placeholder="https://example.com/" value="${save.settings.shareUrl.replaceAll("&", "&amp;").replaceAll('"', "&quot;")}"><small>未設定なら、現在のページのURLを使います。</small></label><p class="fine">記録はこの端末のブラウザに保存されます。</p>${button("close-settings", "戻る", "back", "primary")}`);
}
function how() {
    showModal(`<div class="eyebrow">A DIFFERENT WAY TO THE GOAL</div><h2 id="modal-title">旅するのは、きみと影。</h2><div class="how-list"><p><b>01</b><span>きみを動かす<small>スマホはパッド、PCは WASD / 矢印キー。</small></span></p><p><b>02</b><span>影の先を、緑のひし形へ<small>光から離れると、影が伸びる。</small></span></p><p><b>03</b><span>赤いとげに気をつけて<small>影の途中が触れても失敗。石壁は影なら通れる。</small></span></p></div>${button("close", "わかった", "check", "primary")}`);
}
async function share() {
    const url = save.settings.shareUrl || (location.protocol.startsWith("http") ? location.href.split("#")[0] : "");
    const text = `「影だけ先にゴール」ステージ${stage.id}を ${format(state.time)} でクリア！\nゴールするのは、あなたじゃない。`;
    try {
        if (navigator.share) {
            await navigator.share({
                title: "影だけ先にゴール",
                text,
                ...url ? {
                    url
                } : {}
            });
        } else {
            await navigator.clipboard.writeText(text + (url ? "\n" + url : ""));
            notify("結果をコピーしました");
        }
    } catch (e) {
        if (e instanceof DOMException && e.name === "AbortError") return;
        showModal(`<h2 id="modal-title">結果をコピー</h2><p class="muted">下のテキストを選択してコピーできます。</p><textarea class="share-text" readonly></textarea>${button("close", "戻る", undefined, "primary")}`);
        const area = modal.querySelector("textarea");
        area.value = text + (url ? "\n" + url : "");
        area.select();
    }
}
function action(name) {
    switch(name){
        case "home":
            home();
            break;
        case "start":
            start(unlocked(save));
            break;
        case "stages":
            selectStages();
            break;
        case "retry":
            start(stage.id);
            break;
        case "next":
            start(Math.min(15, stage.id + 1));
            break;
        case "settings":
            settings();
            break;
        case "how":
            how();
            break;
        case "pause":
            pause();
            break;
        case "resume":
        case "close":
            closeModal();
            break;
        case "close-settings":
            {
                const raw = modal.querySelector("#share-url").value.trim();
                if (raw) {
                    try {
                        const u = new URL(raw);
                        if (![
                            "https:",
                            "http:"
                        ].includes(u.protocol)) throw new Error();
                        save.settings.shareUrl = u.href;
                    } catch  {
                        notify("http または https のURLを入力してください");
                        return;
                    }
                } else save.settings.shareUrl = "";
                persist();
                closeModal();
                if (page === "play" && state.status === "won") result();
                else if (page === "play" && state.status === "failed") fail();
                break;
            }
        case "hint":
            showModal(`<div class="eyebrow">A SMALL CLUE</div><h2 id="modal-title">${stage.title}</h2><p class="hint-text">${stage.hint}</p><p class="fine">光とゴールの間に立つと、影が届く場所が見つかる。</p>${button("resume", "試してみる", "arrow", "primary")}`);
            break;
        case "share":
            void share();
            break;
    }
}
app.addEventListener("click", (e)=>{
    const el = e.target.closest("[data-action],[data-stage]");
    if (!el) return;
    e.preventDefault();
    if (el.dataset.action) action(el.dataset.action);
    else if (el.dataset.stage) start(Number(el.dataset.stage));
});
modal.addEventListener("change", (e)=>{
    const el = e.target, k = el.dataset.setting;
    if (k) {
        save.settings[k] = el.checked;
        persist();
        audio.startMusic(save.settings.bgm);
    }
});
modal.addEventListener("cancel", (e)=>{
    e.preventDefault();
    if (state.status === "failed" && page === "play") start(stage.id);
    else if (state.status === "won" && page === "play") selectStages();
    else closeModal();
});
const movement = new Set([
    "w",
    "a",
    "s",
    "d",
    "arrowup",
    "arrowleft",
    "arrowdown",
    "arrowright",
    "shift"
]);
window.addEventListener("keydown", (e)=>{
    if (e.target.matches("input,textarea")) return;
    const k = e.key.toLowerCase();
    if (page === "play" && !modal.open) {
        if (movement.has(k)) {
            e.preventDefault();
            keys.add(k);
        }
        if (k === "r" && !e.repeat) start(stage.id);
        if (k === "escape") {
            e.preventDefault();
            pause();
        }
    }
});
window.addEventListener("keyup", (e)=>keys.delete(e.key.toLowerCase()));
window.addEventListener("focus", ()=>{
    if (!document.hidden) audio.resume();
});
window.addEventListener("blur", ()=>{
    clearInput();
    if (page === "play" && !modal.open) pause();
    audio.suspend();
});
document.addEventListener("visibilitychange", ()=>{
    clearInput();
    if (document.hidden) {
        if (page === "play") pause();
        audio.suspend();
    } else {
        audio.resume();
        last = performance.now();
        acc = 0;
    }
});
function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    clock += dt;
    if (page === "play" && !paused && state.status === "playing") {
        acc += dt;
        const input = {
            x: (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0) + stick.x,
            y: (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0) + stick.y
        };
        while(acc >= FIXED_DT && state.status === "playing"){
            state = advance(stage, state, input, FIXED_DT, save.settings.precision || keys.has("shift"));
            acc -= FIXED_DT;
        }
        const timer = document.querySelector("#timer");
        if (timer) timer.innerHTML = `${state.time.toFixed(2)}<span>s</span>`;
        if (stage.id === 1 && state.moved) document.querySelector("#tutorial").textContent = "影の先をゴールへ！";
        if (state.status === "won") onWin();
        else if (state.status === "failed") fail();
    }
    if (ctx) {
        if (page === "home") {
            const demo = {
                ...createState(stages[0]),
                player: {
                    x: 300 + Math.sin(clock * 0.4) * 28,
                    y: 300 + Math.cos(clock * 0.3) * 30
                },
                time: clock,
                moved: true
            };
            draw(ctx, stages[0], demo, {
                reduced: save.settings.reducedMotion,
                demo: true,
                clock
            });
        } else if (page === "play") {
            if (state.status === "won") celebration += dt;
            draw(ctx, stage, state, {
                reduced: save.settings.reducedMotion,
                clock: state.status === "won" ? celebration : clock
            });
        }
    }
    requestAnimationFrame(frame);
}
home();
requestAnimationFrame((t)=>{
    last = t;
    requestAnimationFrame(frame);
});
if (false) Object.assign(window, {
    __shadow: {
        snapshot: ()=>({
                stage: stage.id,
                state: structuredClone(state),
                page,
                save: structuredClone(save),
                paused
            }),
        load: (id)=>{
            save.bests = Object.fromEntries(Array.from({
                length: id - 1
            }, (_, i)=>[
                    i + 1,
                    99
                ]));
            start(id);
        },
        step: (input, dt)=>{
            if (paused) throw new Error("paused");
            state = advance(stage, state, input, dt);
            if (state.status === "won") onWin();
            if (state.status === "failed") fail();
        },
        finish: ()=>result()
    }
});

</script>
  </body>
</html>
